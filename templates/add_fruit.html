<!DOCTYPE html>
<html lang="fa">
<head>
  <meta charset="UTF-8">
  <title>افزودن فاکتور</title>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Vazirmatn', sans-serif;
      background-color: #f2f2f2;
      padding: 20px;
    }
    .form-container {
      max-width: 500px;
      margin: auto;
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    label {
      display: block;
      margin-bottom: 5px;
      margin-top: 15px;
    }
    input, select {
      width: 100%;
      padding: 8px;
      margin-bottom: 10px;
      border-radius: 6px;
      border: 1px solid #ccc;
    }
    button {
      width: 100%;
      padding: 10px;
      background-color: #007BFF;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 16px;
    }
    a {
      display: inline-block;
      margin-top: 15px;
      color: #007BFF;
      text-decoration: none;
    }
    .top-menu {
      text-align: center;
      margin-bottom: 20px;
    }
  </style>
</head>
<body>
  <div class="form-container">
    <div class="top-menu">
      <h2>➕ افزودن فاکتور جدید</h2>
      <a href="/">🏠 خانه</a> |
      <a href="/download/pdf">⬇️ دانلود PDF</a> |
      <a href="/logout">🚪 خروج</a>
    </div>
    <form method="POST">
      <label>تاریخ (میلادی):</label>
      <input type="date" name="date" required>

      <label>نوع میوه:</label>
      <input type="text" name="fruit_type" required>

      <label>وزن (کیلوگرم):</label>
      <input type="number" step="0.01" name="weight" required>

      <label>تعداد جعبه:</label>
      <input type="number" name="box_count" required>

      <label>فی (قیمت هر کیلو):</label>
      <input type="number" step="0.01" name="price_per_kg" required>

      <label>نام سردخانه:</label>
      <input type="text" name="cold_storage_name" required>

      <label>هزینه باسکول:</label>
      <input type="number" step="0.01" name="scale_cost" required>

      <label>پلاک ماشین:</label>
      <input type="text" name="car_plate" required>

      <label>نام راننده:</label>
      <input type="text" name="driver_name" required>

      <button type="submit">ذخیره فاکتور</button>
    </form>
  </div>
</body>
</html>
